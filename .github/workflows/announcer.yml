name: VOD Announcer

# Runs every 15 minutes on GitHub's servers - your PC stays OFFLINE.
# GitHub cron is best-effort (can be delayed a few minutes at busy times);
# that is fine because every run resumes from the committed state.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Discovery only (no download/upload/announce)"
        type: boolean
        default: false
      diagnose:
        description: "Print source report and exit"
        type: boolean
        default: false

permissions:
  contents: write   # needed to commit state.json back to the repo

concurrency:
  group: vod-announcer
  cancel-in-progress: false   # never kill a run mid-upload; queue instead

jobs:
  run:
    # pinned to 24.04 so GitHub's future ubuntu-latest (Ubuntu 26) migration
    # can never surprise an unattended pipeline
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v7   # v7 = native Node 24 (no deprecation warning)

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run VOD Announcer
        env:
          # REQUIRED - where announcements are posted:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Optional overrides (defaults: beaststatsofficial / 60 / 2 / @bobmasterbillie):
          STREAMERS: ${{ secrets.STREAMERS }}
          WAIT_MINUTES: ${{ secrets.WAIT_MINUTES }}
          BACKLOG_DAYS: ${{ secrets.BACKLOG_DAYS }}
          CONTACT: ${{ secrets.CONTACT }}
          # Optional: streamrecorder.io session cookie for FULL downloads.
          # BOTH secret names are accepted (either one is enough):
          STREAMRECORDER_COOKIE: ${{ secrets.STREAMRECORDER_COOKIE || secrets.SR_SESSION_COOKIE }}
          # Optional: your logged-in RECORDINGS page URL (helps find fresh links):
          SR_DASHBOARD_URL: ${{ secrets.SR_DASHBOARD_URL }}
          # Manual trigger switches:
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
          DIAGNOSE: ${{ github.event.inputs.diagnose == 'true' && '1' || '' }}
        run: python -m app.main

      - name: Commit state (so the next run remembers everything)
        run: bash scripts/commit_state.sh
